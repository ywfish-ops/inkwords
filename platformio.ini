; PlatformIO Project Configuration File for Waveshare ESP32-S3 3.97 ePaper / Touch
; Target: ESP32-S3-WROOM-1 / ESP32-S3R8 (16MB Flash, 8MB PSRAM)

[platformio]
default_envs = esp32-s3-epaper

[env:esp32-s3-epaper]
test_ignore = *
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口自动查找 (插不同 USB 口时 /dev/cu.usbmodem* 编号会变); 有多个候选时用 --upload-port 指定
monitor_speed = 115200

; 启用板载 USB CDC 串口打印（原生 USB 必须启用）
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; 16MB Flash 与 8MB PSRAM 支持
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_16MB.csv
lib_deps = bblanchon/ArduinoJson@^7.4.2

; 主机端单元测试 (不依赖硬件): ~/.venv-esp/bin/pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<ui/canvas_480x800.cpp> +<ui/font_data.cpp> +<ui/flashcard_ui.cpp> +<audio/mp3_stream.cpp> +<core/settings_menu.cpp> +<core/deck_loader.cpp> +<core/review_input.cpp> +<core/study_day.cpp> +<core/leitner.cpp> +<core/log_format.cpp>
lib_deps = bblanchon/ArduinoJson@^7.4.2
